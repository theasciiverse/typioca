# Asciiverse release workflow (tag v* or run by hand with a tag)
# Builds typioca for the Asciiverse catalog: one archive per target,
# named <id>-<target>.tar.gz (Linux, macOS) or .zip (Windows), plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
#
# Tags look like v3.1.0+20250306-av.1. Pure Go (Bubble Tea) with cgo off,
# so one Linux runner cross-builds every target and the Linux binaries are
# static (named musl, the target av looks for first). The two built-in
# word lists are compiled in; the others download from upstream when a
# player turns them on in Config.

name: release

on:
  push:
    tags: ["*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: typioca
  BIN: typioca
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and package
        env:
          CGO_ENABLED: "0"
        run: |
          # typioca --version prints the upstream version, 3.1.0
          version=${TAG#v}; version=${version%%+*}; version=${version%%-av.*}
          mkdir -p dist
          while read -r goos goarch target; do
            ext=; [ "$goos" = windows ] && ext=.exe
            rm -rf stage && mkdir stage
            GOOS=$goos GOARCH=$goarch go build -trimpath -tags netgo \
              -ldflags "-w -s -X 'github.com/bloznelis/typioca/cmd.Version=$version'" \
              -o "stage/$BIN$ext" .
            cp LICENSE README.md PATCHES.md stage/
            if [ "$goos" = windows ]; then
              (cd stage && zip -q -r "../dist/$ID-$target.zip" .)
            else
              tar -czf "dist/$ID-$target.tar.gz" -C stage .
            fi
            file "stage/$BIN$ext"
          done <<'TARGETS'
          linux amd64 x86_64-unknown-linux-musl
          linux arm64 aarch64-unknown-linux-musl
          darwin amd64 x86_64-apple-darwin
          darwin arm64 aarch64-apple-darwin
          windows amd64 x86_64-pc-windows-msvc
          windows arm64 aarch64-pc-windows-msvc
          TARGETS

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "typioca $TAG" \
                 --notes "typioca by Lukas Bloznelis and contributors (github.com/bloznelis/typioca), built for the Asciiverse catalog: one binary for Linux, macOS and Windows. MIT. Changes: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
